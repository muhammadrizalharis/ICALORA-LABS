# ICALORA-LABS — Stack APLIKASI dalam Docker (backend + bot + frontend)
#
# Jalankan dari folder ini:
#   docker compose -f docker-compose.app.yml up -d --build
#
# Catatan penting:
# - Memakai network_mode: host agar semua referensi 127.0.0.1 di backend/.env
#   (Postgres remote via IP-nya, Redis, SeaweedFS/S3, Ollama) tetap bekerja
#   tanpa mengubah konfigurasi apa pun.
# - Port 58010 (backend) & 58030 (frontend) bind langsung ke host. Karena itu,
#   HENTIKAN dulu service systemd lama agar port tidak bentrok:
#     systemctl --user stop icalora-backend icalora-bot icalora-frontend
# - Rahasia dibaca dari backend/.env (TIDAK di-commit; lihat .gitignore).

name: icalora-app

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: icalora-backend:latest
    container_name: icalora-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../../backend/.env
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "58010"]
    # CORE (api.core.ac.uk) di balik Cloudflare: dari VM ini IP default
    # (172.67.x) & IPv6 di-RESET, sedangkan edge 104.26.x andal (10/10 uji).
    # Pin ke edge yang hidup agar sumber teks-penuh OA CORE bisa dipakai.
    # Gagal-aman: bila IP ini mati, _q_core cuma mengembalikan daftar kosong.
    extra_hosts:
      - "api.core.ac.uk:104.26.0.0"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:58010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 4g

  bot:
    image: icalora-backend:latest
    container_name: icalora-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../../backend/.env
    command: ["python", "-m", "app.bot.telegram_bot"]
    volumes:
      # Akses Docker Engine API untuk perintah admin (/services, /restart, /logs).
      # Bot privat (allowlist + secret), hanya VM admin.
      - /var/run/docker.sock:/var/run/docker.sock
    # GID grup 'docker' host (pemilik docker.sock) agar appuser bisa akses socket.
    group_add:
      - "999"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  # Skor Binoculars (zero-shot, pelengkap model embedding AI Detector).
  # Model Qwen2.5-1.5B (observer + instruct) dibaca dari ~/icalora-models
  # (read-only, offline). Model hanya dimuat saat ada deteksi dan dilepas dari
  # VRAM setelah BINOC_IDLE_SECONDS tanpa permintaan; VRAM dibatasi < 10 GB.
  binoculars:
    # Tag tetap dari ch-compute (torch 2.5.1 + transformers) agar pembaruan image
    # ComputeHub tidak mengubah layanan ini; layer dibagi, tanpa disk tambahan.
    image: icalora-binoculars:base
    container_name: icalora-binoculars
    restart: unless-stopped
    network_mode: host
    user: "1015:1015"
    working_dir: /app
    command: ["python", "-u", "server.py"]
    environment:
      HOME: /tmp
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BINOC_PORT: "58050"
      BINOC_IDLE_SECONDS: "300"
      BINOC_MAX_VRAM_GB: "9"
      BINOC_MIN_FREE_MB: "10240"
    volumes:
      - ../../services/binoculars:/app:ro
      - ${HOME}/icalora-models/binoculars-hf:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:58050/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 8g

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: icalora-frontend:latest
    container_name: icalora-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://127.0.0.1:58010
    command: ["npx", "next", "start", "-p", "58030", "-H", "127.0.0.1"]
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
